<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务管理 - 知HR工具集</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- 共享认证模块 -->
    <script src="../shared-auth.js"></script>
    <script src="../shared-auth-modal.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Fira Sans', 'system-ui', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <style>
        html { scroll-behavior: smooth; }
        body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .dark .task-table tbody tr:hover { background: #334155; }
.task-table tbody tr .delete-btn { opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.task-table tbody tr:hover .delete-btn { opacity: 1; pointer-events: auto; }
        .task-table tbody tr.completed { background: #e8f5e9; }
        .task-table tbody tr.completed td { color: #2e7d32; }
        .dark .task-table tbody tr.completed { background: #1b3d1e; }
        .dark .task-table tbody tr.completed td { color: #81c784; }
        .task-table tbody tr.overdue { background: #ffebee; }
        .dark .task-table tbody tr.overdue { background: #3b1c1c; }
        .dark .task-table th { background: #1e293b; }
        
        .task-table th { position: relative; }
        .task-table th:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 20%;
            height: 60%;
            width: 8px;
            cursor: col-resize;
            border-right: 2px solid transparent;
            transition: border-color 0.2s;
        }
        .task-table th:not(:last-child):hover::after {
            border-color: #94a3b8;
        }
        .dark .task-table th:not(:last-child):hover::after {
            border-color: #64748b;
        }
        
        .sort-indicator.asc::after { content: "↑"; }
        .sort-indicator.desc::after { content: "↓"; }
        .sort-indicator.none::after { content: "↕"; }
        
        .sort-indicator-cat.asc::after { content: "↑"; }
        .sort-indicator-cat.desc::after { content: "↓"; }
        .sort-indicator-cat.none::after { content: "↕"; }
        
        .sort-indicator-date.asc::after { content: "↑"; }
        .sort-indicator-date.desc::after { content: "↓"; }
        .sort-indicator-date.none::after { content: "↕"; }
        
        .priority-high { color: #ef4444; }
        .priority-medium { color: #f97316; }
        .priority-low { color: #22c55e; }
        
        .task-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: #3b82f6; }
        
        .dark .category-item { background: #334155; }
        
        @media print {
            .no-print { display: none !important; }
        }
        
        @media (max-width: 768px) {
            .task-table { font-size: 12px; }
            .task-table th, .task-table td { padding: 8px 6px; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-200 font-sans">

    <!-- 自定义确认对话框 -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 shadow-xl p-6 w-full max-w-sm mx-4">
            <div class="text-center">
                <div id="confirmIcon" class="w-16 h-16 mx-auto mb-4 rounded-full bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center">
                    <i data-lucide="alert-circle" class="w-8 h-8 text-blue-600 dark:text-blue-400"></i>
                </div>
                <h3 id="confirmTitle" class="text-lg font-semibold text-slate-800 dark:text-slate-100 mb-2"></h3>
                <p id="confirmMessage" class="text-sm text-slate-600 dark:text-slate-400 mb-6"></p>
                <div class="flex gap-3">
                    <button id="confirmBtn" onclick="confirmCallback(true)" class="flex-1 px-4 py-2 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 transition-colors cursor-pointer">
                        确定
                    </button>
                    <button id="cancelBtn" onclick="confirmCallback(false)" class="flex-1 px-4 py-2 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 font-medium rounded-md hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors cursor-pointer">
                        取消
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 共享登录/注册弹窗 -->
    <!-- 由 shared-auth-modal.js 动态生成 -->

    <!-- 统一导航栏 -->
    <nav class="h-16 bg-white border-b border-slate-200 dark:bg-slate-800 dark:border-slate-700 px-4 md:px-6 lg:px-8 flex items-center justify-between sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-3 cursor-pointer" onclick="window.open('https://www.zhihr.vip', '_blank')">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="text-blue-600 dark:text-blue-400">
                <circle cx="12" cy="5" r="1"/>
                <path d="m9 20 3-6 3 6"/>
                <path d="m6 8 6 2 6-2"/>
                <path d="M12 10v4"/>
            </svg>
            <div>
                <h1 class="text-lg font-semibold text-slate-800 dark:text-slate-100">知HR-任务管理</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">Vibe Coding，为HR制作效率工具</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <button id="btnLogin" onclick="openLoginModal()" class="px-2 sm:px-3 py-1.5 sm:py-2 h-8 sm:h-9 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 transition-colors duration-200 cursor-pointer flex items-center gap-1.5">
                <i data-lucide="log-in" class="w-3 h-3 sm:w-4 sm:h-4"></i>
                <span class="hidden sm:inline">登录</span>
            </button>
            <div id="loggedInArea" class="hidden relative">
                <button id="btnUser" onclick="toggleUserMenu()" class="px-2 sm:px-3 py-1.5 sm:py-2 h-8 sm:h-9 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-medium rounded-md hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors duration-200 cursor-pointer flex items-center gap-1.5 border border-slate-200 dark:border-slate-600">

            <div class="flex flex-col md:flex-row md:items-center gap-3">

    <!-- 新建任务 Modal -->

    <!-- 分类管理 Modal -->
    <div class="modal-overlay" id="categoryModal">

            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-semibold text-slate-800 dark:text-slate-100">分类管理</h2>
                <button onclick="closeCategoryModal()" class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors cursor-pointer">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="categoryList" class="space-y-2 mb-4 max-h-64 overflow-y-auto">
            </div>
            <div class="flex gap-2">
                <input type="text" id="newCategoryInput" placeholder="输入新分类名称" class="flex-1 px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-md bg-white dark:bg-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500" onkeypress="if(event.key==='Enter'){event.preventDefault();addCategory();}">
                <button onclick="addCategory()" class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700 transition-colors cursor-pointer">添加</button>
            </div>
        </div>

    <script>
        // ========================================
        // Cloudflare API 配置
        // ========================================
        const API_BASE_URL = 'https://api.zhihr.vip';
        // 开发环境使用本地地址
        // const API_BASE_URL = 'http://localhost:8787';

        let isOnline = navigator.onLine;
        let currentUserId = null;
        let currentToken = null;
        let offlineQueue = [];

        function isLoggedIn() {
            if (typeof SharedAuth === 'undefined' || !SharedAuth) return false;
            const user = SharedAuth.getUser();
            return !!(user && user.isAuthenticated && user.userId);
        }

        function getAuthToken() {
            if (typeof SharedAuth === 'undefined' || !SharedAuth) return null;
            return SharedAuth.getToken();
        }

        // ========================================
        // 细粒度云端操作
        // ========================================

        async function createTaskToCloud(task) {
            if (!isOnline) {
                addToOfflineQueue('createTask', { task });
                return;
            }
            try {
                const token = getAuthToken();
                const response = await fetch(`${API_BASE_URL}/api/tasks`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(task)
                });
                if (!response.ok) throw new Error(`创建任务失败: ${response.status}`);
                const result = await response.json();
                if (result.data && result.data.id) {
                    const localTask = tasks.find(t => t.id === task.id);
                    if (localTask) localTask.id = result.data.id;
                    saveToStorage();
                }
                console.log('云端任务已创建:', task.id);
            } catch (error) {
                console.error('创建云端任务失败:', error);
                addToOfflineQueue('createTask', { task });
            }
        }

        async function updateTaskToCloud(taskId, task) {
            if (!isOnline) {
                addToOfflineQueue('updateTask', { taskId, task });
                return;
            }
            try {
                const token = getAuthToken();
                const response = await fetch(`${API_BASE_URL}/api/tasks/${taskId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(task)
                });
                if (!response.ok) throw new Error(`更新任务失败: ${response.status}`);
                console.log('云端任务已更新:', taskId);
            } catch (error) {
                console.error('更新云端任务失败:', error);
                addToOfflineQueue('updateTask', { taskId, task });
            }
        }

        async function deleteTaskFromCloud(taskId) {
            if (!isOnline) {
                addToOfflineQueue('delete', { taskId });
                return;
            }
            try {
                const token = getAuthToken();
                const response = await fetch(`${API_BASE_URL}/api/tasks/${taskId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                if (!response.ok) throw new Error(`删除任务失败: ${response.status}`);
                console.log('云端任务已删除:', taskId);
            } catch (error) {
                console.error('删除云端任务失败:', error);
                addToOfflineQueue('delete', { taskId });

        }

        // ========================================

        // ========================================
        
        function saveOfflineQueue() {
            localStorage.setItem('taskManagerOfflineQueue', JSON.stringify(offlineQueue));
        }

        function loadOfflineQueue() {
            const saved = localStorage.getItem('taskManagerOfflineQueue');
            if (saved) {
                try {
                    offlineQueue = JSON.parse(saved);
                } catch (e) {
                    offlineQueue = [];
                }
            }
        }

        function addToOfflineQueue(operation, data) {
            offlineQueue.push({
                operation: operation,
                data: data,
                timestamp: new Date().toISOString()
            });
            saveOfflineQueue();
            console.log('已添加离线操作:', operation, data);
        }

        async function processOfflineQueue() {
            if (!isOnline || !isLoggedIn() || offlineQueue.length === 0) {
                return;
            }

            console.log('开始处理离线队列，共', offlineQueue.length, '个操作');

            const queue = [...offlineQueue];
            offlineQueue = [];
            saveOfflineQueue();

            let successCount = 0;
            let failCount = 0;

            for (const item of queue) {
                try {
                    switch (item.operation) {
                        case 'createTask':
                            await createTaskToCloud(item.data.task);
                            successCount++;
                            break;
                        case 'updateTask':
                            await updateTaskToCloud(item.data.taskId, item.data.task);
                            successCount++;
                            break;
                        case 'delete':
                            await deleteTaskFromCloud(item.data.taskId);
                            successCount++;
                            break;
                        default:
                            console.warn('未知操作类型:', item.operation);
                    }
                } catch (error) {
                    console.error('处理离线操作失败:', error);
                    failCount++;
                    offlineQueue.push(item);
                }
            }

            if (offlineQueue.length > 0) {
                saveOfflineQueue();
            }

            console.log('离线队列处理完成: 成功', successCount, '个, 失败', failCount, '个');
        }

        async function mergeDataOnLogin() {
            if (!isOnline || !isLoggedIn()) {
                console.log('离线或未登录，跳过合并');
                return;
            }

            const localTasks = [...tasks];
            const localCategories = [...categories];

            try {
                const cloudTasks = await loadCloudTasks();
                const cloudCategories = await loadCloudCategories();

                if (cloudTasks === null && cloudCategories === null) {
                    console.log('无法加载云端数据，保持本地数据不变');
                    return;
                }

                const mergedTasks = [];
                const processedIds = new Set();

                if (cloudTasks) {
                    cloudTasks.forEach(cloudTask => {
                        const localTask = localTasks.find(t => t.id === cloudTask.id);
                        if (localTask) {
                            const cloudTime = new Date(cloudTask.updated_at || cloudTask.created_at || '1970-01-01').getTime();
                            const localTime = new Date(localTask.updated_at || localTask.created_at || '1970-01-01').getTime();
                            mergedTasks.push(localTime > cloudTime ? localTask : cloudTask);
                        } else {
                            mergedTasks.push(cloudTask);
                        }
                        processedIds.add(cloudTask.id);
                    });
                }

                localTasks.forEach(localTask => {
                    if (!processedIds.has(localTask.id)) {
                        mergedTasks.push(localTask);
                    }
                });

                let mergedCategories = [...localCategories];
                if (cloudCategories && cloudCategories.length > 0) {
                    const cloudCatNames = cloudCategories.map(c => c.name);
                    cloudCatNames.forEach(name => {
                        if (!mergedCategories.includes(name)) {
                            mergedCategories.push(name);
                        }
                    });
                } else if (cloudCategories && cloudCategories.length === 0 && localCategories.length === 0) {
                    mergedCategories = ['工作', '生活', '学习', '其他'];
                }

                tasks = mergedTasks;
                categories = mergedCategories;
                saveToStorage();

                for (const task of mergedTasks) {
                    const isCloudTask = cloudTasks && cloudTasks.find(t => t.id === task.id);
                    const isLocalOnly = !isCloudTask;
                    if (isLocalOnly) {
                        await createTaskToCloud(task);
                    } else {
                        const localTask = localTasks.find(t => t.id === task.id);
                        if (localTask) {
                            const cloudTime = new Date(isCloudTask.updated_at || isCloudTask.created_at || '1970-01-01').getTime();
                            const localTime = new Date(localTask.updated_at || localTask.created_at || '1970-01-01').getTime();
                            if (localTime > cloudTime) {
                                await updateTaskToCloud(task.id, task);
                            }
                        }
                    }
                }

                await syncCategoriesToCloud();

                renderTasks();
                updateCategoryFilter();
                console.log('数据合并完成:', mergedTasks.length, '个任务,', mergedCategories.length, '个分类');
            } catch (error) {
                console.error('数据合并失败:', error);
            }
        }


        // ========================================
        // 原有功能
        // ========================================
        
        const STATUS = { TODO: '待办', IN_PROGRESS: '进行中', COMPLETED: '已完成' };
        const PRIORITY = { HIGH: '高', MEDIUM: '中', LOW: '低' };
        const PRIORITY_ORDER = { [PRIORITY.HIGH]: 1, [PRIORITY.MEDIUM]: 2, [PRIORITY.LOW]: 3 };

        let tasks = [];
        let categories = ['工作', '生活', '学习', '其他'];
        let prioritySortDirection = null;
        let categorySortDirection = null;
        let dueDateSortDirection = null;
        
        // 主初始化函数
        function initializeApp() {
            isOnline = navigator.onLine;
            loadOfflineQueue();
            loadFromStorage();

            tasks.forEach(task => {
                if (task.status === STATUS.COMPLETED && !task.completed_at) {
                    task.completed_at = task.updated_at || task.created_at || new Date().toISOString();
                }
            });
            saveToStorage();
            renderTasks();
            updateCategoryFilter();
            initTheme();
            initColumnResize();
            
            // 初始化共享认证
            initSharedAuth();
            updateUserDisplay();
            
            if (isLoggedIn() && isOnline && offlineQueue.length > 0) {

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            
            document.getElementById('themeToggle').addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                const isDark = document.documentElement.classList.contains('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                lucide.createIcons();
            });
        }
        
        let columnResizing = null;
        let resizeStartX = 0;
        let resizeStartWidth = 0;
        
        function initColumnResize() {
            document.addEventListener('mousemove', (e) => {
                if (!columnResizing) return;
                const diff = e.pageX - resizeStartX;
                const newWidth = Math.max(50, resizeStartWidth + diff);
                columnResizing.style.width = newWidth + 'px';
            });
            
            document.addEventListener('mouseup', () => {
                if (columnResizing) {
                    columnResizing = null;
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                }
            });
            
            bindColumnResize();
        }
        
        function bindColumnResize() {
            const table = document.getElementById('taskTable');
            if (!table) return;
            
            const headers = table.querySelectorAll('th');
            headers.forEach((th, index) => {
                th.addEventListener('mousedown', (e) => {
                    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
                    
                    columnResizing = th;
                    resizeStartX = e.pageX;
                    resizeStartWidth = th.offsetWidth;
                    document.body.style.cursor = 'col-resize';
                    document.body.style.userSelect = 'none';
                    e.preventDefault();
                });
            });
        }

        function loadFromStorage() {
            try {
                const savedTasks = localStorage.getItem('tasks');
                const savedCategories = localStorage.getItem('categories');
                if (savedTasks) tasks = JSON.parse(savedTasks);
                if (savedCategories) categories = JSON.parse(savedCategories);
            } catch (e) {
                console.error('加载数据失败:', e);
                tasks = [];
                categories = ['工作', '生活', '学习', '其他'];
            }
        }

        function saveToStorage() {
            try {
                localStorage.setItem('tasks', JSON.stringify(tasks));
                localStorage.setItem('categories', JSON.stringify(categories));
            } catch (e) {
                console.error('保存数据失败:', e);
                alert('保存失败，可能是存储空间不足');
            }
        }

        function getFilteredTasks() {
            const statusFilter = document.getElementById('filterStatus').value;
            const priorityFilter = document.getElementById('filterPriority').value;
            const categoryFilter = document.getElementById('filterCategory').value;
            const search = document.getElementById('searchInput').value.toLowerCase();

            return tasks.filter(task => {
                if (statusFilter && task.status !== statusFilter) return false;
                if (priorityFilter && task.priority !== priorityFilter) return false;
                if (categoryFilter && task.category !== categoryFilter) return false;
                if (search && !task.title.toLowerCase().includes(search) && 
                    !task.description?.toLowerCase().includes(search)) return false;
                return true;
            });
        }

        function handleFilterChange(filterType) {
            const filterId = 'filter' + filterType.charAt(0).toUpperCase() + filterType.slice(1);
            const currentFilter = document.getElementById(filterId);
            const currentValue = currentFilter.value;
            
            if (currentValue) {
                if (filterType !== 'status') {
                    document.getElementById('filterStatus').value = '';
                }
                if (filterType !== 'priority') {
                    document.getElementById('filterPriority').value = '';
                }
                if (filterType !== 'category') {
                    document.getElementById('filterCategory').value = '';
                }
                
                prioritySortDirection = null;
                categorySortDirection = null;
                dueDateSortDirection = null;
                
                updateSortIndicator();
                updateCategorySortIndicator();
                updateDueDateSortIndicator();
            }
            
            renderTasks();
        }

        function sortTasks(taskList) {
            const pending = taskList.filter(t => t.status !== STATUS.COMPLETED);
            const completed = taskList.filter(t => t.status === STATUS.COMPLETED);

            pending.sort((a, b) => {
                let diff;
                
                if (categorySortDirection) {
                    const catA = a.category || '';
                    const catB = b.category || '';
                    diff = catA.localeCompare(catB, 'zh-CN');
                    if (diff !== 0) return categorySortDirection === 'asc' ? diff : -diff;
                }
                
                if (dueDateSortDirection) {
                    if (!a.due_date && !b.due_date) diff = 0;
                    else if (!a.due_date) diff = 1;
                    else if (!b.due_date) diff = -1;
                    else diff = new Date(a.due_date) - new Date(b.due_date);
                    if (diff !== 0) return dueDateSortDirection === 'asc' ? diff : -diff;
                }
                
                if (prioritySortDirection) {
                    diff = PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority];
                    if (diff !== 0) return prioritySortDirection === 'desc' ? diff : -diff;
                }
                
                if (!a.due_date && !b.due_date) return 0;
                if (!a.due_date) return 1;
                if (!b.due_date) return -1;
                return new Date(a.due_date) - new Date(b.due_date);
            });

            completed.sort((a, b) => {
                const timeA = a.completed_at ? new Date(a.completed_at) : 0;
                const timeB = b.completed_at ? new Date(b.completed_at) : 0;
                return timeB - timeA;
            });

            return [...pending, ...completed];
        }

        function togglePrioritySort() {
            if (prioritySortDirection === null) {
                prioritySortDirection = 'desc';
            } else if (prioritySortDirection === 'desc') {
                prioritySortDirection = 'asc';

            updateSortIndicator();

                categorySortDirection = null;

        function toggleDueDateSort() {

        function renderTasks() {
            const filtered = getFilteredTasks();
            const sorted = sortTasks(filtered);
            const tbody = document.getElementById('taskTableBody');
            const emptyState = document.getElementById('emptyState');
            const table = document.getElementById('taskTable');

            if (sorted.length === 0) {
                emptyState.classList.remove('hidden');
                table.classList.add('hidden');
                lucide.createIcons();
                return;
            }

            emptyState.classList.add('hidden');
            table.classList.remove('hidden');
            tbody.innerHTML = sorted.map(task => renderTaskRow(task)).join('');
            lucide.createIcons();
            bindColumnResize();
        }

        function renderTaskRow(task) {
            const isCompleted = task.status === STATUS.COMPLETED;
            const isOverdue = (task.status === STATUS.TODO || task.status === STATUS.IN_PROGRESS) && task.due_date && task.due_date < new Date().toLocaleDateString('sv-SE');
            const priorityClass = task.priority === PRIORITY.HIGH ? 'priority-high' :
                                 task.priority === PRIORITY.MEDIUM ? 'priority-medium' : 'priority-low';
            const priorityIcon = task.priority === PRIORITY.HIGH ? '🔴' : task.priority === PRIORITY.MEDIUM ? '🟡' : '🟢';

            return `
                <tr class="task-row ${isCompleted ? 'completed' : ''} ${isOverdue ? 'overdue' : ''} hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors" data-id="${task.id}">
                    <td class="px-3 py-3">
                        <input type="checkbox" class="task-checkbox" ${isCompleted ? 'checked' : ''}
                               onchange="toggleComplete('${task.id}', this.checked)">
                    </td>
                    <td class="px-4 py-3 text-slate-800 dark:text-slate-200 editable cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-600" onclick="enableEdit(this, '${task.id}', 'title')">
                        ${escapeHtml(task.title)}
                    </td>
                    <td class="px-4 py-3 text-slate-600 dark:text-slate-400 editable cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-600" onclick="enableEdit(this, '${task.id}', 'category')">
                        ${escapeHtml(task.category) || '-'}
                    </td>
                    <td class="px-4 py-3 editable cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-600" onclick="enableEdit(this, '${task.id}', 'status')">
                        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs sm:text-sm font-medium ${
                            task.status === STATUS.TODO ? 'bg-yellow-100 text-yellow-700 dark:bg-yellow-900/30 dark:text-yellow-400' :
                            task.status === STATUS.IN_PROGRESS ? 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400' :
                            'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400'
                        }">${task.status}</span>
                    </td>
                    <td class="px-4 py-3 ${priorityClass} editable cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-600" onclick="enableEdit(this, '${task.id}', 'priority')">
                        ${priorityIcon} ${task.priority}
                    </td>
                    <td class="px-4 py-3 text-slate-600 dark:text-slate-400 editable cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-600" onclick="enableEdit(this, '${task.id}', 'due_date')">
                        ${task.due_date || '-'}
                    </td>
                    <td class="px-4 py-3 text-slate-500 dark:text-slate-400 editable cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-600 truncate max-w-[200px]" onclick="enableEdit(this, '${task.id}', 'description')">
                        ${escapeHtml(task.description) || '-'}
                    </td>
                    <td class="px-3 py-3 text-center">
                        <button onclick="deleteTask('${task.id}')" class="delete-btn p-1 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded transition-colors cursor-pointer" title="删除任务">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </td>
                </tr>
            `;
        }

        function enableEdit(td, taskId, field) {
            if (td.classList.contains('editing')) return;
            if (td.querySelector('input[type="checkbox"]')) return;

            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            const currentValue = task[field] || '';
            td.classList.add('editing');
            td.classList.remove('hover:bg-slate-100', 'dark:hover:bg-slate-600');

            let input;
            if (field === 'status') {
                input = document.createElement('select');
                [STATUS.TODO, STATUS.IN_PROGRESS, STATUS.COMPLETED].forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt;
                    option.textContent = opt;
                    if (opt === currentValue) option.selected = true;
                    input.appendChild(option);
                });
                input.className = 'w-full px-2 py-1 border-2 border-blue-500 rounded bg-white dark:bg-slate-700 dark:text-slate-200';
                input.addEventListener('change', () => {
                    const newValue = input.value;
                    if (newValue !== currentValue) {
                        updateTaskField(taskId, field, newValue);
                    }
                    renderTasks();
                });
            } else if (field === 'priority') {
                input = document.createElement('select');
                [PRIORITY.HIGH, PRIORITY.MEDIUM, PRIORITY.LOW].forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt;
                    option.textContent = opt;
                    if (opt === currentValue) option.selected = true;
                    input.appendChild(option);
                });
                input.className = 'w-full px-2 py-1 border-2 border-blue-500 rounded bg-white dark:bg-slate-700 dark:text-slate-200';
                input.addEventListener('change', () => {
                    const newValue = input.value;
                    if (newValue !== currentValue) {
                        updateTaskField(taskId, field, newValue);
                    }
                    renderTasks();
                });
            } else if (field === 'category') {
                input = document.createElement('select');
                const emptyOption = document.createElement('option');
                emptyOption.value = '';
                emptyOption.textContent = '(无)';
                input.appendChild(emptyOption);
                categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat;
                    if (cat === currentValue) option.selected = true;
                    input.appendChild(option);
                });
                input.className = 'w-full px-2 py-1 border-2 border-blue-500 rounded bg-white dark:bg-slate-700 dark:text-slate-200';
                input.addEventListener('change', () => {
                    const newValue = input.value;
                    if (newValue !== currentValue) {
                        updateTaskField(taskId, field, newValue);
                    }
                    renderTasks();
                });
            } else if (field === 'due_date') {
                input = document.createElement('input');
                input.type = 'date';
                input.value = currentValue;
                input.className = 'w-full px-2 py-1 border-2 border-blue-500 rounded bg-white dark:bg-slate-700 dark:text-slate-200';
            } else {
                input = document.createElement('input');
                input.type = 'text';
                input.value = currentValue;
                input.className = 'w-full px-2 py-1 border-2 border-blue-500 rounded bg-white dark:bg-slate-700 dark:text-slate-200';
            }

            td.innerHTML = '';
            td.appendChild(input);
            input.focus();
            input.select();

            let cancelled = false;

            input.addEventListener('blur', () => {
                if (!cancelled) {
                    const newValue = input.value.trim();
                    if (newValue !== currentValue) {
                        updateTaskField(taskId, field, newValue);
                    }
                    renderTasks();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    input.blur();
                }
                if (e.key === 'Escape') {
                    cancelled = true;
                    renderTasks();
                }
            });
        }

        function updateTaskField(taskId, field, newValue) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            task[field] = newValue;
            task.updated_at = new Date().toISOString();

            if (field === 'status') {
                if (newValue === STATUS.COMPLETED) {
                    task.completed_at = new Date().toISOString();
                } else {
                    task.completed_at = null;
                }
            }

            saveToStorage();
            if (isLoggedIn()) updateTaskToCloud(taskId, task);
        }

        function toggleComplete(taskId, isChecked) {
            const newStatus = isChecked ? STATUS.COMPLETED : STATUS.IN_PROGRESS;
            updateTaskField(taskId, 'status', newStatus);
            renderTasks();
        }

        async function deleteTask(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            if (confirm(`确定要删除任务「${task.title}」吗？此操作不可撤销。`)) {
                if (isLoggedIn()) {
                    try {
                        await deleteTaskFromCloud(taskId);
                    } catch (error) {
                        console.error('删除云端任务失败:', error);
                    }
                }
                tasks = tasks.filter(t => t.id !== taskId);
                saveToStorage();
                renderTasks();
            }
        }

        function openAddModal() {
            document.getElementById('addTaskForm').reset();
            updateNewTaskCategorySelect();
            document.getElementById('addTaskModal').classList.add('active');
            lucide.createIcons();
        }

        function closeAddModal() {
            document.getElementById('addTaskModal').classList.remove('active');
        }

        async function saveNewTask(event) {
            event.preventDefault();

            const newTask = {
                id: Date.now(),
                title: document.getElementById('newTaskTitle').value.trim(),
                description: document.getElementById('newTaskDescription').value.trim(),
                category: document.getElementById('newTaskCategory').value,
                status: STATUS.TODO,
                priority: document.getElementById('newTaskPriority').value,
                due_date: document.getElementById('newTaskDueDate').value,
                created_at: new Date().toISOString().split('T')[0],
                updated_at: new Date().toISOString()
            };

            tasks.push(newTask);
            saveToStorage();
            renderTasks();
            closeAddModal();

            if (isLoggedIn()) {
                await createTaskToCloud(newTask);
            }
        }

        function updateNewTaskCategorySelect() {
            const select = document.getElementById('newTaskCategory');
            select.innerHTML = '<option value="">(无)</option>' + 
                categories.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        function updateCategoryFilter() {
            const select = document.getElementById('filterCategory');
            select.innerHTML = '<option value="">分类</option>' + 
                categories.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        function openCategoryModal() {
            renderCategoryList();
            document.getElementById('categoryModal').classList.add('active');
            lucide.createIcons();
        }

        function closeCategoryModal() {
            document.getElementById('categoryModal').classList.remove('active');
        }

        function renderCategoryList() {
            const container = document.getElementById('categoryList');
            container.innerHTML = categories.map((cat, index) => `
                <div class="category-item flex items-center justify-between p-2 rounded-md">
                    <input type="text" value="${escapeHtml(cat)}" class="flex-1 px-2 py-1 bg-transparent border-none text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded" 
                        onchange="updateCategory(${index}, this.value)">
                    <button onclick="deleteCategory(${index})" class="ml-2 p-1 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded transition-colors cursor-pointer">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function addCategory() {
            const input = document.getElementById('newCategoryInput');
            const name = input.value.trim();
            if (name && !categories.includes(name)) {
                categories.push(name);
                saveToStorage();
                if (isLoggedIn()) syncCategoriesToCloud();
                renderCategoryList();
                updateCategoryFilter();
                updateNewTaskCategorySelect();
                input.value = '';
            }
        }

        function updateCategory(index, newName) {
            const oldName = categories[index];
            categories[index] = newName;
            
            tasks.forEach(task => {
                if (task.category === oldName) {
                    task.category = newName;
                }
            });
            
            saveToStorage();
            if (isLoggedIn()) syncCategoriesToCloud();
            updateCategoryFilter();
            updateNewTaskCategorySelect();
            renderTasks();
        }

        function deleteCategory(index) {
            const name = categories[index];
            if (confirm(`确定要删除分类"${name}"吗？该分类下的任务将变为无分类。`)) {
                tasks.forEach(task => {
                    if (task.category === name) {
                        task.category = '';
                    }
                });
                
                categories.splice(index, 1);
                saveToStorage();
                if (isLoggedIn()) syncCategoriesToCloud();
                renderCategoryList();
                updateCategoryFilter();
                updateNewTaskCategorySelect();
                renderTasks();
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    overlay.classList.remove('active');
                }
            });
        });

        // ========================================
        // 页面初始化
        // ========================================
        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>

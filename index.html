<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知HR工具集 - HR一站式效率工具平台</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <!-- 共享认证模块 -->
  <script src="shared-auth.js"></script>
  <script src="shared-auth-modal.js"></script>

  <!-- Tailwind 配置 -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Fira Sans', 'system-ui', 'sans-serif'],
            mono: ['Fira Code', 'monospace'],
          },
          colors: {
            primary: {
              50: '#EFF6FF',
              100: '#DBEAFE',
              200: '#BFDBFE',
              300: '#93C5FD',
              400: '#60A5FA',
              500: '#3B82F6',
              600: '#2563EB',
              700: '#1D4ED8',
              800: '#1E40AF',
              900: '#1E3A8A',
            },
            cta: {
              500: '#F97316',
              600: '#EA580C',
            },
            success: '#4CAF50',
            warning: '#F59E0B',
            error: '#F44336',
            info: '#2196F3',
          }
        }
      }
    }
  </script>

  <style>
    /* 平滑滚动 */
    html {
      scroll-behavior: smooth;
    }

    /* 拼图网格布局 */
    .mosaic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      width: 100%;
    }

    /* 拼图块基础样式 */
    .mosaic-tile {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border-radius: 12px;
      transition: all 0.2s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    /* 活动工具拼图 */
    .mosaic-tile.active {
      background: linear-gradient(135deg, var(--tile-color-start, #2563EB), var(--tile-color-end, #3B82F6));
      color: white;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2);
    }

    .mosaic-tile.active:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.3);
    }

    /* 空工具拼图（灰色） */
    .mosaic-tile.empty {
      background: #F1F5F9;
      color: #94A3B8;
      border: 2px dashed #E2E8F0;
    }

    .dark .mosaic-tile.empty {
      background: #1E293B;
      color: #64748B;
      border-color: #334155;
    }

    .mosaic-tile.empty:hover {
      background: #E2E8F0;
      border-color: #CBD5E1;
    }

    .dark .mosaic-tile.empty:hover {
      background: #334155;
      border-color: #475569;
    }

    /* 拼图图标 */
    .tile-icon {
      width: 48px;
      height: 48px;
      margin-bottom: 8px;
    }

    .mosaic-tile.active .tile-icon {
      color: white;
    }

    .mosaic-tile.empty .tile-icon {
      color: #94A3B8;
    }

    .dark .mosaic-tile.empty .tile-icon {
      color: #64748B;
    }

    /* 拼图名称 */
    .tile-name {
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 4px;
    }

    /* 拼图描述 */
    .tile-desc {
      font-size: 12px;
      text-align: center;
      opacity: 0.9;
      max-width: 150px;
    }

    .mosaic-tile.empty .tile-desc {
      opacity: 0.7;
    }

    /* 空拼图提示 */
    .empty-hint {
      font-size: 11px;
      text-align: center;
      opacity: 0.6;
      margin-top: 8px;
    }

    /* 深色模式适配 */
    .dark .mosaic-tile.active {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .dark .mosaic-tile.active:hover {
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .mosaic-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 8px;
      }

      .mosaic-tile {
        padding: 12px;
      }

      .tile-icon {
        width: 32px;
        height: 32px;
      }

      .tile-name {
        font-size: 12px;
      }

      .tile-desc {
        font-size: 10px;
      }

      .empty-hint {
        display: none;
      }
    }

    /* 模态窗口样式 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    /* 确认对话框样式 */
    #confirmModal .modal {
      border-radius: 0.75rem;
      border: 1px solid rgba(226, 232, 240, 0.8);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .dark #confirmModal .modal {
      border-color: rgba(51, 65, 85, 0.8);
    }

    #confirmIcon {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1rem;
      border-radius: 50%;
      background: #DBEAFE;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dark #confirmIcon {
      background: rgba(30, 58, 138, 0.3);
    }

    #confirmBtn {
      flex: 1;
      padding: 0.5rem 1rem;
      background: #2563EB;
      color: white;
      font-weight: 500;
      border-radius: 0.375rem;
      transition: background-color 0.2s;
    }

    #confirmBtn:hover {
      background: #1D4ED8;
    }

    #cancelBtn {
      flex: 1;
      padding: 0.5rem 1rem;
      background: #E2E8F0;
      color: #334155;
      font-weight: 500;
      border-radius: 0.375rem;
      transition: background-color 0.2s;
    }

    .dark #cancelBtn {
      background: #334155;
      color: #E2E8F0;
    }

    #cancelBtn:hover {
      background: #CBD5E1;
    }

    .dark #cancelBtn:hover {
      background: #475569;
    }

    /* 打印样式 */
    @media print {
      .no-print {
        display: none !important;
      }
    }

    /* 移动端底部安全区域 */
    @media (max-width: 768px) {
      body {
        padding-bottom: env(safe-area-inset-bottom, 20px);
      }

      /* 按钮区域改为垂直布局 */
      #feedbackForm .flex.items-center.gap-4 {
        flex-wrap: wrap;
        gap: 8px;
      }

      #feedbackForm .flex.items-center.gap-4 > span {
        order: 3;
        width: 100%;
        text-align: center;
      }

      /* 反馈看板内容截断 */
      .feedback-content {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-200">

  <!-- 自定义确认对话框 -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal bg-white dark:bg-slate-800 p-6 w-full max-w-sm mx-4">
      <div class="text-center">
        <div id="confirmIcon" class="mx-auto mb-4">
          <i data-lucide="alert-circle" class="w-8 h-8 text-blue-600 dark:text-blue-400"></i>
        </div>
        <h3 id="confirmTitle" class="text-lg font-semibold text-slate-800 dark:text-slate-100 mb-2"></h3>
        <p id="confirmMessage" class="text-sm text-slate-600 dark:text-slate-400 mb-6"></p>
        <div class="flex gap-3">
          <button id="confirmBtn" onclick="confirmCallback(true)" class="px-4 py-2 font-medium rounded-md hover:bg-blue-700 transition-colors cursor-pointer">
            确定
          </button>
          <button id="cancelBtn" onclick="confirmCallback(false)" class="px-4 py-2 font-medium rounded-md hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors cursor-pointer">
            取消
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 统一导航栏 ==================== -->
  <nav class="h-16 bg-white border-b border-slate-200 dark:bg-slate-800 dark:border-slate-700 px-4 md:px-6 lg:px-8 flex items-center justify-between sticky top-0 z-50 shadow-sm">
    <!-- 左侧：Logo + 工具名称 -->
    <div class="flex items-center gap-3 cursor-pointer" onclick="window.open('https://www.zhihr.vip', '_blank')">
      <!-- Logo -->
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="text-blue-600 dark:text-blue-400">
        <circle cx="12" cy="5" r="1"/>
        <path d="m9 20 3-6 3 6"/>
        <path d="m6 8 6 2 6-2"/>
        <path d="M12 10v4"/>
      </svg>

      <!-- 工具名称 -->
      <div>
        <h1 class="text-lg font-semibold text-slate-800 dark:text-slate-100">知HR</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">Vibe Coding，为HR制作效率工具</p>
      </div>
    </div>

    <!-- 右侧：功能按钮 -->
    <div class="flex items-center gap-2">
      <!-- 主题切换 -->
      <button
        id="themeToggle"
        class="p-2 text-slate-600 hover:text-blue-600 hover:bg-blue-50 dark:text-slate-300 dark:hover:bg-slate-700 rounded-md transition-colors duration-200 cursor-pointer"
        aria-label="切换主题"
        title="切换深色/浅色模式"
      >
        <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
        <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
      </button>
      <!-- 登录按钮 -->
      <button id="btnLogin" onclick="openLoginModal()" class="px-2 sm:px-3 py-1.5 sm:py-2 h-8 sm:h-9 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 transition-colors duration-200 cursor-pointer flex items-center gap-1.5">
        <i data-lucide="log-in" class="w-3 h-3 sm:w-4 sm:h-4"></i>
        <span class="hidden sm:inline">登录</span>
      </button>
      <!-- 已登录状态 -->
      <div id="loggedInArea" class="hidden relative">
        <button id="btnUser" onclick="toggleUserMenu()" class="px-2 sm:px-3 py-1.5 sm:py-2 h-8 sm:h-9 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-medium rounded-md hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors duration-200 cursor-pointer flex items-center gap-1.5 border border-slate-200 dark:border-slate-600">
          <i data-lucide="user" class="w-3 h-3 sm:w-4 sm:h-4"></i>
          <span id="userDisplay" class="hidden sm:inline">账号</span>
        </button>
        <div id="userMenu" class="hidden absolute right-0 mt-2 w-48 bg-white dark:bg-slate-800 rounded-lg shadow-lg border border-slate-200 dark:border-slate-700 py-2 z-50">
          <div class="px-4 py-2 text-sm text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-700">
            <span id="menuUserDisplay"></span>
          </div>
          <button onclick="handleLogout()" class="w-full px-4 py-2 text-left text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 flex items-center gap-2 cursor-pointer">
            <i data-lucide="log-out" class="w-4 h-4"></i>
            退出登录
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- ==================== 主容器 ==================== -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 pt-5 pb-10">

    <!-- ==================== 拼图网格导航 ==================== -->
    <div class="bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 shadow-sm p-6 mb-5">
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-lg font-semibold text-slate-800 dark:text-slate-100">工具导航</h3>
        <div class="flex items-center gap-2">
          <span class="text-sm text-slate-600 dark:text-slate-400">已启用: <span id="activeCount" class="font-semibold text-blue-600">5</span>/100</span>
        </div>
      </div>

      <!-- 拼图网格 -->
      <div id="mosaicGrid" class="mosaic-grid">
        <!-- 工具将通过 JavaScript 动态渲染 -->
      </div>
    </div>

    <!-- ==================== 反馈看板 ==================== -->
    <div class="bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 shadow-sm p-6 mb-5">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold text-slate-800 dark:text-slate-100">收到的需求</h3>
        <span class="text-sm text-slate-500 dark:text-slate-400">最近提交</span>
      </div>

      <!-- 反馈列表（最多显示5条，滚动） -->
      <div id="feedbackBoard" class="space-y-3 max-h-64 overflow-y-auto overflow-x-hidden">
        <!-- 由 JavaScript 动态渲染 -->
      </div>
    </div>

    <!-- ==================== 反馈区域 ==================== -->
    <div class="bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 shadow-sm p-6">
      <h3 class="text-lg font-semibold text-slate-800 dark:text-slate-100 mb-2">提交新工具需求</h3>
      <p class="text-sm text-slate-600 dark:text-slate-400 mb-4">告诉我们你在工作中遇到的痛点，我们免费来帮你开发工具</p>

      <form id="feedbackForm" class="space-y-4">
        <div class="flex gap-4">
          <input
            type="text"
            id="feedbackName"
            class="flex-1 px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-slate-700 dark:text-slate-100"
            placeholder="你的名字（选填）"
          >
        </div>
        <textarea
          id="feedbackContent"
          class="w-full px-4 py-3 border border-slate-300 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-slate-700 dark:text-slate-100 resize-none"
          rows="3"
          placeholder="描述你需要的工具功能..."
          required
        ></textarea>

        <!-- 验证码区域 -->
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2 px-3 py-2 bg-slate-100 dark:bg-slate-700 rounded-md">
            <span id="captchaQuestion" class="text-sm font-medium text-slate-800 dark:text-slate-200">3 + 5 = ?</span>
            <button
              id="refreshCaptcha"
              type="button"
              class="p-1 text-slate-500 hover:text-blue-600 cursor-pointer"
              title="刷新验证码"
            >
              <i data-lucide="refresh-cw" class="w-4 h-4"></i>
            </button>
          </div>
          <input
            type="number"
            id="captchaInput"
            class="w-20 px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-slate-700 dark:text-slate-100"
            placeholder="答案"
            required
          >
          <span id="captchaError" class="text-xs text-red-500 hidden">验证码错误</span>
        </div>

        <!-- 提交次数提示 -->
        <div id="submitLimitInfo" class="text-xs text-slate-500 dark:text-slate-400">
          今日可提交：<span id="remainingCount">3</span> 次
        </div>
        <div id="submitLimitWarning" class="text-sm text-orange-500 hidden">
          今日提交次数已达上限，请明天再来
        </div>

        <div class="flex items-center gap-4">
          <button
            type="submit"
            id="submitBtn"
            class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700 transition-colors duration-200 cursor-pointer flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            <i data-lucide="send" class="w-4 h-4"></i>
            <span>提交需求</span>
          </button>

          <span class="text-xs text-slate-500 dark:text-slate-400">提交后将显示在收到的需求里</span>
        </div>
      </form>
    </div>

  </main>

  <!-- ==================== JavaScript ==================== -->
  <script>
    // 初始化 Lucide 图标
    lucide.createIcons();

    // ==================== API 配置 ====================
    // Cloudflare Workers API配置
    const API_CONFIG = {
      baseUrl: 'https://api.zhihr.vip'
    };

    // EmailJS 配置（邮件通知功能保留）
    const EMAILJS_CONFIG = {
      publicKey: 'wSqoO64Pd08fm_YJV',
      serviceId: 'service_xg8y8h9',
      templateId: 'template_yoss5zo'
    };

    // 初始化 EmailJS
    emailjs.init(EMAILJS_CONFIG.publicKey);

    // ==================== 反馈缓存配置 ====================
    // 缓存键
    const FEEDBACK_CACHE_KEY = 'feedback_cache_v1';
    // 缓存有效期：1小时（毫秒）
    const CACHE_EXPIRE_TIME = 60 * 60 * 1000;

    // 获取本地缓存
    function getFeedbackCache() {
      try {
        const cached = localStorage.getItem(FEEDBACK_CACHE_KEY);
        if (cached) {
          return JSON.parse(cached);
        }
      } catch (e) {
        console.warn('缓存读取失败:', e);
      }
      return null;
    }

    // 保存本地缓存
    function saveFeedbackCache(feedbacks) {
      try {
        const cacheData = {
          feedbacks: feedbacks,
          cacheTime: Date.now()
        };
        localStorage.setItem(FEEDBACK_CACHE_KEY, JSON.stringify(cacheData));
      } catch (e) {
        console.warn('缓存保存失败:', e);
      }
    }

    // 检查缓存是否有效（一周内）
    function isCacheValid() {
      const cache = getFeedbackCache();
      if (!cache || !cache.cacheTime) return false;
      return (Date.now() - cache.cacheTime) < CACHE_EXPIRE_TIME;
    }

    // 更新本地缓存中的反馈（添加新反馈）
    function addToLocalCache(newFeedback) {
      const cache = getFeedbackCache();
      if (cache && cache.feedbacks) {
        cache.feedbacks.push(newFeedback);
        // 最多保留100条
        if (cache.feedbacks.length > 100) {
          cache.feedbacks.splice(0, cache.feedbacks.length - 100);
        }
        saveFeedbackCache(cache.feedbacks);
      } else {
        saveFeedbackCache([newFeedback]);
      }
    }

    // ==================== 工具数据配置 ====================
    const TOOLS_CONFIG = [
      {
        id: 1,
        name: '项目甘特图',
        desc: '可视化项目进度',
        icon: 'gantt-chart',
        url: 'https://www.zhihr.vip//gantt-web/index.html',
        colorStart: '#E74C3C',
        colorEnd: '#C0392B'
      },
      {
        id: 2,
        name: '员工数据看板',
        desc: '花名册可视化',
        icon: 'users',
        url: 'https://www.zhihr.vip/dashboard/index.html',
        colorStart: '#3498DB',
        colorEnd: '#2980B9'
      },
      {
        id: 3,
        name: '组织架构图',
        desc: '团队结构一目了然',
        icon: 'network',
        url: 'https://www.zhihr.vip/org-chart/index.html',
        colorStart: '#27AE60',
        colorEnd: '#1E8449'
      },
      {
        id: 4,
        name: '招聘漏斗',
        desc: '转化流程分析',
        icon: 'filter',
        url: 'https://www.zhihr.vip/funnel/index.html',
        colorStart: '#F39C12',
        colorEnd: '#D68910'
      },
      {
        id: 5,
        name: '任务管理工具',
        desc: '任务清单（TodoList）管理',
        icon: 'check-square',
        url: 'https://zhihr.vip/task-manager/index.html',
        colorStart: '#10B981',
        colorEnd: '#059669'
      },
      {
        id: 6,
        name: '复盘系统',
        desc: '结构化复盘与回顾',
        icon: 'clipboard-check',
        url: 'https://zhihr.vip/review-system/index.html',
        colorStart: '#6366F1',
        colorEnd: '#4F46E5'
      },

    ];

    // 拼图总数（可扩展至50或100）
    const TOTAL_TILES = 7;

    // ==================== 点击频次管理 ====================
    function getClickCounts() {
      return JSON.parse(localStorage.getItem('tool_click_counts') || '{}');
    }

    function saveClickCounts(counts) {
      localStorage.setItem('tool_click_counts', JSON.stringify(counts));
    }

    function incrementClickCount(toolId) {
      const counts = getClickCounts();
      counts[toolId] = (counts[toolId] || 0) + 1;
      saveClickCounts(counts);
    }

    // 根据点击频次排序工具
    function sortToolsByClickCount() {
      const counts = getClickCounts();
      return [...TOOLS_CONFIG].sort((a, b) => {
        const countA = counts[a.id] || 0;
        const countB = counts[b.id] || 0;
        return countB - countA; // 点击多的排前面
      });
    }

    // ==================== 渲染拼图网格 ====================
    function renderMosaicGrid() {
      const gridContainer = document.getElementById('mosaicGrid');
      gridContainer.innerHTML = '';

      // 按点击频次排序
      const sortedTools = sortToolsByClickCount();

      for (let i = 0; i < TOTAL_TILES; i++) {
        const tool = sortedTools[i];

        const tile = document.createElement('div');
        tile.className = `mosaic-tile ${tool ? 'active' : 'empty'}`;

        if (tool) {
          // 活动工具拼图
          tile.style.setProperty('--tile-color-start', tool.colorStart);
          tile.style.setProperty('--tile-color-end', tool.colorEnd);

          tile.innerHTML = `
            <i data-lucide="${tool.icon}" class="tile-icon"></i>
            <div class="tile-name">${tool.name}</div>
            <div class="tile-desc">${tool.desc}</div>
          `;

          // 点击打开新标签页并记录点击次数
          tile.addEventListener('click', () => {
            incrementClickCount(tool.id);
            window.open(tool.url, '_blank');
          });
        } else {
          // 空工具拼图（灰色）
          tile.innerHTML = `
            <i data-lucide="plus" class="tile-icon"></i>
            <div class="tile-name">待添加</div>
            <div class="empty-hint">点击提交建议</div>
          `;

          // 点击滚动到反馈区域
          tile.addEventListener('click', () => {
            document.getElementById('feedbackForm').scrollIntoView({ behavior: 'smooth' });
            document.getElementById('feedbackForm').querySelector('textarea').focus();
          });
        }

        gridContainer.appendChild(tile);
      }

      // 重新初始化图标
      lucide.createIcons();

      // 更新统计
      document.getElementById('activeCount').textContent = TOOLS_CONFIG.length;
    }

    // ==================== 搜索功能 ====================
    const searchBtn = document.getElementById('searchBtn');
    if (searchBtn) {
      searchBtn.addEventListener('click', () => {
        const searchTerm = prompt('搜索工具名称:');
        if (searchTerm) {
          const foundTool = TOOLS_CONFIG.find(tool =>
            tool.name.toLowerCase().includes(searchTerm.toLowerCase())
          );

          if (foundTool) {
            window.open(foundTool.url, '_blank');
          } else {
            alert('未找到相关工具，请提交建议让我们开发！');
          }
        }
      });
    }

    // ==================== 帮助功能 ====================
    const helpBtn = document.getElementById('helpBtn');
    if (helpBtn) {
      helpBtn.addEventListener('click', () => {
        alert('使用说明：\n\n1. 点击彩色拼图块打开对应工具\n2. 点击灰色拼图块提交新工具建议\n3. 使用搜索按钮快速查找工具\n4. 切换深色/浅色模式适应环境');
      });
    }

    // ==================== 反馈看板渲染（优先使用本地缓存） ====================
    async function renderFeedbackBoard() {
      const board = document.getElementById('feedbackBoard');

      // 优先检查本地缓存是否有效
      if (isCacheValid()) {
        const cache = getFeedbackCache();
        if (cache && cache.feedbacks && cache.feedbacks.length > 0) {
          // 按时间倒序排列（最新的在前）
          cache.feedbacks.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
          renderFeedbackItems(board, cache.feedbacks);
          console.log('使用本地缓存数据（1小时内有效）');
          return;
        }
      }

      // 缓存过期或无缓存，从云端拉取
      board.innerHTML = '<div class="text-center py-8"><p class="text-sm text-slate-500">正在加载...</p></div>';

      try {
        const response = await fetch(`${API_CONFIG.baseUrl}/api/feedbacks?limit=100`);
        
        if (!response.ok) {
          throw new Error(`API返回${response.status}`);
        }

        const result = await response.json();
        const feedbacks = result.data || [];

        if (feedbacks.length === 0) {
          board.innerHTML = `
            <div class="text-center py-8">
              <p class="text-sm text-slate-500 dark:text-slate-400">暂无提交的需求</p>
              <p class="text-xs text-slate-400 dark:text-slate-500 mt-1">提交后将在此显示</p>
            </div>
          `;
          return;
        }

        // 保存到本地缓存
        saveFeedbackCache(feedbacks);
        console.log('从云端拉取并缓存数据');

        // 按时间倒序排列（最新的在前）
        feedbacks.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        renderFeedbackItems(board, feedbacks);
      } catch (error) {
        console.log('API失败，显示模拟数据:', error.message);
        renderMockFeedbacks(board);
      }
    }

    // ==================== 渲染反馈列表项 ====================
    function renderFeedbackItems(board, feedbacks) {
      board.innerHTML = '';

      const statusColors = {
        'pending': 'bg-yellow-100 text-yellow-700 dark:bg-yellow-900 dark:text-yellow-300',
        'processing': 'bg-blue-100 text-blue-700 dark:bg-blue-900 dark:text-blue-300',
        'completed': 'bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300'
      };
      const statusTexts = {
        'pending': '待处理',
        'processing': '处理中',
        'completed': '已完成'
      };

      feedbacks.forEach(fb => {
        const item = document.createElement('div');
        item.className = 'bg-slate-50 dark:bg-slate-700/50 rounded-lg p-3';

        // 格式化时间
        const time = new Date(fb.created_at || fb.time);
        const timeStr = `${time.getFullYear()}年${time.getMonth() + 1}月${time.getDate()}日`;

        item.innerHTML = `
          <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 overflow-hidden">
            <div class="flex items-center gap-3 sm:gap-4 shrink-0">
              <span class="text-sm font-medium text-slate-800 dark:text-slate-100 whitespace-nowrap">${fb.name}</span>
              <span class="text-sm text-slate-600 dark:text-slate-300 whitespace-nowrap">${timeStr}</span>
              <span class="px-2 py-1 text-xs rounded-full ${statusColors[fb.status] || statusColors['pending']} whitespace-nowrap">${statusTexts[fb.status] || statusTexts['pending']}</span>
            </div>
            <div class="text-sm text-slate-600 dark:text-slate-300 flex-1 min-w-0 overflow-hidden">
              <span class="block truncate">${fb.content}</span>
            </div>
          </div>
        `;

        board.appendChild(item);
      });
    }

    // ==================== 模拟数据（API失败时显示） ====================
    function renderMockFeedbacks(board) {
      board.innerHTML = '';

      const mockData = [
        {
          name: '张三',
          time: '2026年4月10日',
          status: 'completed',
          content: '希望能有一个自动生成周报的工具，每周手动写周报太费时间了'
        },
        {
          name: '李四',
          time: '2026年4月11日',
          status: 'processing',
          content: '需要离职率分析工具，可以按部门、时间段统计分析离职情况'
        },
        {
          name: '王五',
          time: '2026年4月12日',
          status: 'pending',
          content: '人才盘点分析工具，希望能可视化展示人才结构和分布'
        },
        {
          name: '匿名',
          time: '2026年4月13日',
          status: 'pending',
          content: 'OKR追踪工具，方便团队设定和跟踪目标完成进度'
        }
      ];

      const statusColors = {
        'pending': 'bg-yellow-100 text-yellow-700 dark:bg-yellow-900 dark:text-yellow-300',
        'processing': 'bg-blue-100 text-blue-700 dark:bg-blue-900 dark:text-blue-300',
        'completed': 'bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300'
      };
      const statusTexts = {
        'pending': '待处理',
        'processing': '处理中',
        'completed': '已完成'
      };

      mockData.forEach(fb => {
        const item = document.createElement('div');
        item.className = 'bg-slate-50 dark:bg-slate-700/50 rounded-lg p-3';

        item.innerHTML = `
          <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 overflow-hidden">
            <div class="flex items-center gap-3 sm:gap-4 shrink-0">
              <span class="text-sm font-medium text-slate-800 dark:text-slate-100 whitespace-nowrap">${fb.name}</span>
              <span class="text-sm text-slate-600 dark:text-slate-300 whitespace-nowrap">${fb.time}</span>
              <span class="px-2 py-1 text-xs rounded-full ${statusColors[fb.status]} whitespace-nowrap">${statusTexts[fb.status]}</span>
            </div>
            <div class="text-sm text-slate-600 dark:text-slate-300 flex-1 min-w-0 overflow-hidden">
              <span class="block truncate">${fb.content}</span>
            </div>
          </div>
        `;

        board.appendChild(item);
      });
    }

    // ==================== 验证码和提交限制 ====================
    let captchaAnswer = 0;

    // 生成验证码
    function generateCaptcha() {
      const num1 = Math.floor(Math.random() * 10) + 1;
      const num2 = Math.floor(Math.random() * 10) + 1;
      captchaAnswer = num1 + num2;
      document.getElementById('captchaQuestion').textContent = `${num1} + ${num2} = ?`;
      document.getElementById('captchaInput').value = '';
      document.getElementById('captchaError').classList.add('hidden');
    }

    // 获取今日提交次数
    function getTodaySubmitCount() {
      const today = new Date().toLocaleDateString('zh-CN');
      const submitData = JSON.parse(localStorage.getItem('submit_limits') || '{}');
      if (submitData.date === today) {
        return submitData.count || 0;
      }
      return 0;
    }

    // 更新今日提交次数
    function updateSubmitCount() {
      const today = new Date().toLocaleDateString('zh-CN');
      const submitData = {
        date: today,
        count: getTodaySubmitCount() + 1
      };
      localStorage.setItem('submit_limits', JSON.stringify(submitData));
    }

    // 更新剩余次数显示
    function updateRemainingCount() {
      const remaining = Math.max(0, 3 - getTodaySubmitCount());
      document.getElementById('remainingCount').textContent = remaining;

      const limitInfo = document.getElementById('submitLimitInfo');
      const limitWarning = document.getElementById('submitLimitWarning');

      if (remaining === 0) {
        limitInfo.classList.add('hidden');
        limitWarning.classList.remove('hidden');
      } else {
        limitInfo.classList.remove('hidden');
        limitWarning.classList.add('hidden');
      }
    }

    // 初始化验证码和提交限制
    generateCaptcha();
    updateRemainingCount();

    // 刷新验证码按钮
    document.getElementById('refreshCaptcha').addEventListener('click', () => {
      generateCaptcha();
      lucide.createIcons();
    });

    // ==================== 反馈表单 ====================
    const feedbackForm = document.getElementById('feedbackForm');
    const submitBtn = document.getElementById('submitBtn');

    feedbackForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      // 验证验证码
      const captchaInput = document.getElementById('captchaInput');
      const userAnswer = parseInt(captchaInput.value);
      if (userAnswer !== captchaAnswer) {
        document.getElementById('captchaError').classList.remove('hidden');
        generateCaptcha();
        return;
      }

      const nameInput = document.getElementById('feedbackName');
      const contentInput = document.getElementById('feedbackContent');
      const name = nameInput.value.trim();
      const content = contentInput.value.trim();

      if (!content) {
        alert('请输入需求内容');
        return;
      }

      // 提交到 Cloudflare API
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>提交中...</span>';
      lucide.createIcons();

      try {
        // 提交到新的 API
        const response = await fetch(`${API_CONFIG.baseUrl}/api/feedbacks`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name: name || '匿名',
            content: content,
            status: 'pending'
          })
        });

        const result = await response.json();

        if (result.success) {
          // 发送邮件通知（可选功能）
          try {
            await emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, {
              name: name || '匿名',
              content: content,
              time: new Date().toLocaleString('zh-CN')
            });
          } catch (emailError) {
            console.log('邮件发送失败:', emailError);
          }

          // 更新本地缓存（添加新反馈到缓存开头）
          const cache = getFeedbackCache();
          if (cache && cache.feedbacks) {
            cache.feedbacks.unshift(result.data);
            if (cache.feedbacks.length > 100) {
              cache.feedbacks.pop();
            }
            saveFeedbackCache(cache.feedbacks);
          } else {
            saveFeedbackCache([result.data]);
          }

          alert('需求已提交成功！我们会尽快处理 ❤️');
          // 清空表单
          nameInput.value = '';
          contentInput.value = '';
          generateCaptcha();
          // 刷新看板（使用本地缓存）
          renderFeedbackBoard();
        } else {
          alert('提交失败，请稍后重试。\n' + (result.message || '未知错误'));
        }
      } catch (error) {
        alert('提交失败。\n网络错误：' + error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i data-lucide="send" class="w-4 h-4"></i><span>提交需求</span>';
        lucide.createIcons();
      }
    });
  </script>

  <!-- ==================== 初始化 ==================== -->
  <script>
    // 初始化共享认证
    function initSharedAuth() {
      if (SharedAuth) {
        SharedAuth.init();
        
        // 监听认证状态变化
        SharedAuth.on('auth:change', (state) => {
          console.log('[Homepage] Auth state changed:', state);
          updateUserDisplay();
        });
        
        SharedAuth.on('auth:logout', () => {
          console.log('[Homepage] User logged out');
        });
        
        // 同步当前状态
        const user = SharedAuth.getUser();
        if (user.isAuthenticated) {
          currentUserId = user.userId;
        }
      }
    }

    function openLoginModal() {
      if (AuthModal) {
        AuthModal.open('login');
      }
    }

    function updateUserDisplay() {
      const user = SharedAuth ? SharedAuth.getUser() : { isAuthenticated: false, username: null };
      
      if (user.isAuthenticated && user.username) {
        // 已登录状态
        document.getElementById('btnLogin').classList.add('hidden');
        document.getElementById('loggedInArea').classList.remove('hidden');
        document.getElementById('userDisplay').textContent = user.username;
        document.getElementById('menuUserDisplay').textContent = user.username;
      } else {
        // 未登录状态
        document.getElementById('btnLogin').classList.remove('hidden');
        document.getElementById('loggedInArea').classList.add('hidden');
      }
    }

    function handleLogout() {
      // 先关闭用户菜单
      const userMenu = document.getElementById('userMenu');
      if (userMenu) {
        userMenu.classList.add('hidden');
      }

      showConfirmDialog(
        '退出登录',
        '确定要退出登录吗？',
        '退出',
        '取消'
      ).then((confirmed) => {
        if (!confirmed) {
          return;
        }

        if (SharedAuth) {
          SharedAuth.logout();
        }
        updateUserDisplay();
      });
    }

    let confirmResolve = null;

    function showConfirmDialog(title, message, confirmText = '确定', cancelText = '取消') {
      return new Promise((resolve) => {
        confirmResolve = resolve;

        document.getElementById('confirmTitle').textContent = title;
        document.getElementById('confirmMessage').textContent = message;
        document.getElementById('confirmBtn').textContent = confirmText;
        document.getElementById('cancelBtn').textContent = cancelText;

        document.getElementById('confirmModal').classList.add('active');
        lucide.createIcons();
      });
    }

    function confirmCallback(result) {
      document.getElementById('confirmModal').classList.remove('active');
      if (confirmResolve) {
        confirmResolve(result);
        confirmResolve = null;
      }
    }

    function toggleUserMenu() {
      const menu = document.getElementById('userMenu');
      menu.classList.toggle('hidden');
      lucide.createIcons();
    }

    // 点击其他地方关闭用户菜单
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('userMenu');
      const btn = document.getElementById('btnUser');
      if (menu && btn && !menu.classList.contains('hidden')) {
        if (!menu.contains(e.target) && !btn.contains(e.target)) {
          menu.classList.add('hidden');
        }
      }
    });

    // 页面初始化
    document.addEventListener('DOMContentLoaded', () => {
      // 初始化共享认证
      initSharedAuth();
      
      // 初始化主题
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
      
      // 主题切换
      document.getElementById('themeToggle').addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        const isDark = document.documentElement.classList.contains('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });
      
      // 更新用户显示
      updateUserDisplay();
      
      // 初始化图标
      lucide.createIcons();
      
      // 渲染拼图网格和反馈看板
      renderMosaicGrid();
      renderFeedbackBoard();
      
      console.log('[Homepage] Initialized');
    });
  </script>

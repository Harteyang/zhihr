        </div>

                <i data-lucide="file-text" class="w-5 h-5 text-blue-600"></i>
                旧数据 JSON
            </h2>
            <textarea id="jsonInput" rows="15" 
                      class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm"
                      placeholder="粘贴旧数据 JSON 到这里..."></textarea>
            <button onclick="loadSampleData()" class="mt-3 text-sm text-blue-600 hover:text-blue-800">

        <!-- 迁移操作 -->

            <h2 class="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
                <i data-lucide="upload" class="w-5 h-5 text-blue-600"></i>
                迁移操作
            </h2>
            <div class="space-y-4">
                <button id="migrateBtn" onclick="handleMigration()" disabled
                        class="px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center gap-2">
                    <i data-lucide="database-zap" class="w-5 h-5"></i>
                    开始迁移
                </button>
            </div>
            <div id="migrationLog" class="mt-4 p-4 bg-slate-100 rounded-lg hidden">
                <h3 class="font-semibold text-slate-800 mb-2">迁移日志</h3>
                <div id="logContent" class="text-sm text-slate-600 space-y-1 max-h-64 overflow-y-auto"></div>
            </div>
        </div>
    </div>

        function log(message, type = 'info') {
            const logDiv = document.getElementById('migrationLog');
            const logContent = document.getElementById('logContent');
            logDiv.classList.remove('hidden');
            
            const colors = {
                info: 'text-blue-600',
                success: 'text-green-600',
                error: 'text-red-600'
            };
            
            const entry = document.createElement('div');
            entry.className = colors[type] || colors.info;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContent.appendChild(entry);
            logContent.scrollTop = logContent.scrollHeight;
        }

        async function handleLogin() {
            const apiBaseUrl = document.getElementById('apiBaseUrl').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginStatus = document.getElementById('loginStatus');

            if (!username || !password) {
                loginStatus.className = 'mt-2 p-3 bg-red-100 text-red-700 rounded-lg';
                loginStatus.textContent = '请输入用户名和密码';
                loginStatus.classList.remove('hidden');
                return;
            }

            try {
                log('尝试登录...');
                
                let response = await fetch(`${apiBaseUrl}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) {
                    log('用户不存在，尝试注册...', 'info');
                    response = await fetch(`${apiBaseUrl}/api/auth/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                }

                const result = await response.json();
                
                if (result.success) {
                    authToken = result.data.token;
                    userId = result.data.userId;
                    
                    loginStatus.className = 'mt-2 p-3 bg-green-100 text-green-700 rounded-lg';
                    loginStatus.textContent = `登录成功！用户ID: ${userId}`;
                    loginStatus.classList.remove('hidden');
                    
                    document.getElementById('migrateBtn').disabled = false;
                    log('登录成功，可以开始迁移', 'success');
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                loginStatus.className = 'mt-2 p-3 bg-red-100 text-red-700 rounded-lg';
                loginStatus.textContent = `登录失败: ${error.message}`;
                loginStatus.classList.remove('hidden');
                log(`登录失败: ${error.message}`, 'error');
            }
        }

        function generateId() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        async function handleMigration() {
            const apiBaseUrl = document.getElementById('apiBaseUrl').value;
            const jsonInput = document.getElementById('jsonInput').value;
            const migrateBtn = document.getElementById('migrateBtn');

            if (!jsonInput) {
                log('请输入 JSON 数据', 'error');
                return;
            }

            migrateBtn.disabled = true;
            migrateBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> 迁移中...';
            lucide.createIcons();

            try {
                const data = JSON.parse(jsonInput);
                log('数据解析成功');

                const userData = Object.values(data.users)[0];
                if (!userData) {
                    throw new Error('未找到用户数据');
                }

                log(`找到 ${userData.categories?.length || 0} 个分类，${userData.tasks?.length || 0} 个任务，${data.reviews?.length || 0} 个复盘`);

                let successCount = 0;
                let failCount = 0;

                if (userData.categories && userData.categories.length > 0) {
                    log('开始迁移分类...');
                    const existingCats = await (await fetch(`${apiBaseUrl}/api/categories`, {
                        headers: { 'Authorization': `Bearer ${authToken}` }
                    })).json();
                    const existingCatNames = (existingCats.data || []).map(c => c.name);

                    for (const cat of userData.categories) {
                        if (existingCatNames.includes(cat)) {
                            log(`分类 "${cat}" 已存在，跳过`, 'info');
                            continue;
                        }
                        
                        try {
                            const response = await fetch(`${apiBaseUrl}/api/categories`, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${authToken}`
                                },
                                body: JSON.stringify({ name: cat })
                            });

                            if (response.ok) {
                                successCount++;
                                log(`✓ 分类 "${cat}" 迁移成功`, 'success');
                            } else {
                                failCount++;
                                log(`✗ 分类 "${cat}" 迁移失败`, 'error');
                            }
                        } catch (e) {
                            failCount++;
                            log(`✗ 分类 "${cat}" 迁移失败: ${e.message}`, 'error');
                        }
                    }
                }

                if (userData.tasks && userData.tasks.length > 0) {
                    log('开始迁移任务...');
                    
                    for (const task of userData.tasks) {
                        try {
                            const response = await fetch(`${apiBaseUrl}/api/tasks`, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${authToken}`
                                },
                                body: JSON.stringify({
                                    title: task.title,
                                    description: task.description,
                                    category: task.category,
                                    priority: task.priority,
                                    due_date: task.due_date,
                                    status: task.status
                                })
                            });

                            if (response.ok) {
                                successCount++;
                                log(`✓ 任务 "${task.title}" 迁移成功`, 'success');
                            } else {
                                failCount++;
                                log(`✗ 任务 "${task.title}" 迁移失败`, 'error');
                            }
                        } catch (e) {
                            failCount++;
                            log(`✗ 任务 "${task.title}" 迁移失败: ${e.message}`, 'error');
                        }
                    }
                }

                if (data.reviews && data.reviews.length > 0) {
                    log('开始迁移复盘...');
                    
                    for (const review of data.reviews) {
                        try {
                            const response = await fetch(`${apiBaseUrl}/api/reviews`, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${authToken}`
                                },
                                body: JSON.stringify({
                                    title: review.summary || '复盘',
                                    content: review.content,
                                    review_date: review.date
                                })
                            });

                            if (response.ok) {
                                successCount++;
                                log(`✓ 复盘 "${review.summary || '复盘'}" 迁移成功`, 'success');
                            } else {
                                failCount++;
                                log(`✗ 复盘 "${review.summary || '复盘'}" 迁移失败`, 'error');
                            }
                        } catch (e) {
                            failCount++;
                            log(`✗ 复盘迁移失败: ${e.message}`, 'error');
                        }
                    }
                }

                log(`迁移完成！成功: ${successCount}, 失败: ${failCount}`, successCount > 0 ? 'success' : 'error');

            } catch (error) {
                log(`迁移失败: ${error.message}`, 'error');
            }

            migrateBtn.disabled = false;
            migrateBtn.innerHTML = '<i data-lucide="database-zap" class="w-5 h-5"></i> 开始迁移';
            lucide.createIcons();
        }
    </script>

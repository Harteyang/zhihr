<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moodist 自然之声</title>

  <!-- Howler.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
  <!-- Lucide Icons (CDN) -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="flex flex-col h-screen">
    <!-- Navbar -->
    <nav class="navbar">
      <div class="nav-left" onclick="window.open('https://www.zhihr.vip', '_blank')">
        <svg class="nav-logo" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="5" r="1"/>
          <path d="m9 20 3-6 3 6"/>
          <path d="m6 8 6 2 6-2"/>
          <path d="M12 10v4"/>
        </svg>
        <div>
          <div class="nav-title">知HR-自然之声</div>
          <div class="nav-subtitle">Vibe Coding，为HR制作效率工具</div>
        </div>
      </div>

      <div class="nav-actions">
        <button class="nav-btn" id="btnFavorites" title="收藏夹">
          <i data-lucide="heart" class="icon-sm"></i> <span>收藏</span>
        </button>
        <button class="nav-btn" id="btnPresets" title="预设">
          <i data-lucide="bookmark" class="icon-sm"></i> <span>预设</span>
        </button>
        <button class="nav-btn" id="btnShare" title="分享">
          <i data-lucide="share-2" class="icon-sm"></i> <span>分享</span>
        </button>
        <button class="nav-icon-btn" id="themeToggle" title="切换深色/浅色模式">
          <i data-lucide="sun" class="w-5 h-5 hidden"></i>
          <i data-lucide="moon" class="w-5 h-5"></i>
        </button>
      </div>
    </nav>
    

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 w-full flex-1">
     <div class="categories" id="categories"></div>
      <div class="main-content">
        <div class="sound-section">
          <div class="sound-grid" id="soundGrid"></div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="footer-left">
        <span id="selectedCount">未选择声音</span>
      </div>
      <div class="footer-right">
        <button class="footer-btn" id="btnShuffle">
          <i data-lucide="shuffle" class="icon-sm"></i> 随机
        </button>
        <button class="footer-btn danger" id="btnStopAll">
          <i data-lucide="play" class="icon-sm" id="btnStopAllIcon"></i> <span id="btnStopAllText">全部播放</span>
        </button>
        <select class="timer-select" id="timerSelect">
          <option value="">倒计时</option>
          <option value="5">5 分钟</option>
          <option value="15">15 分钟</option>
          <option value="30">30 分钟</option>
          <option value="60">60 分钟</option>
        </select>
      </div>
    </footer>
  </div>

  <!-- Presets Modal -->
  <div class="modal-overlay" id="modalPresets">
    <div class="modal">
      <button class="modal-close" onclick="closeModal('modalPresets')">&times;</button>
      <div class="modal-title">组合音效</div>
      <div class="save-preset">
        <input type="text" id="presetName" placeholder="组合名称..." />
        <button onclick="savePreset()">保存</button>
      </div>
      <div id="presetList"></div>
    </div>
  </div>

  <!-- Share Modal -->
  <div class="modal-overlay" id="modalShare">
    <div class="modal">
      <button class="modal-close" onclick="closeModal('modalShare')">&times;</button>
      <div class="modal-title">分享声音组合</div>
      <div class="share-link-box">
        <input type="text" id="shareLink" readonly />
        <button onclick="copyShareLink()">复制</button>
      </div>
      <p style="font-size:13px;color:var(--color-text-subtle);">打开链接将自动恢复当前选中的声音组合。</p>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Scripts -->
  <script src="js/sounds-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

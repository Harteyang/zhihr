name = "miaodu-backend"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# 排除不需要上传到 Cloudflare 的文件/目录
exclude = [".git", "node_modules", ".wrangler", "dist", ".vscode", ".idea"]

# 使用与 zhihr-api 相同的 D1 数据库
# 注意：表名前缀 miaodu_ 避免与现有表冲突
[[d1_databases]]
binding = "DB"
database_name = "zhihr_db"
database_id = "cd693196-036e-4fd9-9d0c-e077683ce6f3"

# 允许的前端域名（CORS）
[vars]
ALLOWED_ORIGINS = "https://zhihr.vip,https://www.zhihr.vip,https://api2.zhihr.vip,http://localhost:5173,http://localhost:5174"

# 以下通过 wrangler secret 注入:
# MLOOK_USERNAME
# MLOOK_PASSWORD

name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('review-system/pnpm-lock.yaml', 'moodist/pnpm-lock.yaml', 'miaodu/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: |
          cd review-system
          pnpm install
          VITE_BASE=/review-system/ pnpm build

      - name: Build moodist
        run: |
          cd moodist
          pnpm install
          CDN_URL="${{ secrets.SOUNDS_CDN_URL }}"
          if [ -z "$CDN_URL" ]; then
            CDN_URL="https://cdn.jsdelivr.net/gh/remvze/moodist@main/public/sounds"
          fi
          SOUNDS_CDN_URL="$CDN_URL" pnpm build

      - name: Build miaodu
        run: |
          cd miaodu/frontend
          npm ci
          VITE_API_BASE="${{ secrets.MIAODU_API_BASE_URL }}" VITE_BASE=/miaodu/ npm run build

      - name: Prepare deployment
        run: |
          mkdir -p /tmp/deploy
          for item in $(ls -A | grep -v -E '^(review-system|moodist|miaodu)$'); do
            cp -r "$item" /tmp/deploy/
          done
          cp -r review-system/dist /tmp/deploy/review-system
          cp -r moodist/dist /tmp/deploy/moodist
          cp -r miaodu/frontend/dist /tmp/deploy/miaodu

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/deploy
          publish_branch: gh-pages
          force_orphan: true
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: review-system/pnpm-lock.yaml

      - name: Build review-system
        run: |
          cd review-system
          pnpm install
          VITE_BASE=/review-system/ pnpm build

      - name: Prepare deployment
        run: |
          # Create a staging directory with the correct structure
          mkdir -p /tmp/deploy
          # Copy everything except review-system source code
          for item in $(ls -A | grep -v review-system); do
            cp -r "$item" /tmp/deploy/
          done
          # Copy review-system build output (dist) as the review-system directory
          cp -r review-system/dist /tmp/deploy/review-system

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '/tmp/deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

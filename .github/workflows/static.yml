name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('review-system/pnpm-lock.yaml', 'moodist/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: |
          cd review-system
          pnpm install
          VITE_BASE=/review-system/ pnpm build

      - name: Build moodist
        run: |
          cd moodist
          pnpm install
          # Use jsdelivr CDN for sounds (from original moodist repo)
          # Override with SOUNDS_CDN_URL secret if set
          CDN_URL="${{ secrets.SOUNDS_CDN_URL }}"
          if [ -z "$CDN_URL" ]; then
            CDN_URL="https://cdn.jsdelivr.net/gh/remvze/moodist@main/public/sounds"
          fi
          SOUNDS_CDN_URL="$CDN_URL" pnpm build

      - name: Prepare deployment
        run: |
          # Create a staging directory with the correct structure
          mkdir -p /tmp/deploy
          # Copy everything except source code directories
          for item in $(ls -A | grep -v -E '^(review-system|moodist)$'); do
            cp -r "$item" /tmp/deploy/
          done
          # Copy review-system build output (dist) as the review-system directory
          cp -r review-system/dist /tmp/deploy/review-system
          # Copy moodist build output as the moodist directory
          cp -r moodist/dist /tmp/deploy/moodist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '/tmp/deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/talent-pool/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>人才库管理</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="text/javascript">
      // GitHub Pages SPA fallback：从 404.html 重定向回来时恢复原始路径
      // _p 中保存了完整原始路径（含 search 和 hash）
      (function () {
        var match = location.search.match(/[?&]_p=([^&]+)/)
        if (match) {
          var originalPath = decodeURIComponent(match[1])
          history.replaceState(null, '', originalPath)
        }
      })()
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人才库管理</title>
  <script type="text/javascript">
    // GitHub Pages SPA fallback：将未知路径重定向到入口 index.html
    // 同时通过 search 参数保留原始路径，由入口脚本恢复
    (function () {
      var base = '/talent-pool/'
      var segmentCount = base.split('/').length - 1
      var location = window.location
      var origin = location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '')
      var pathParts = location.pathname.split('/').filter(Boolean)
      var newPathname = '/' + pathParts.slice(0, segmentCount).join('/') + '/'
      var restPath = '/' + pathParts.slice(segmentCount).join('/')
      var redirectUrl = origin + newPathname + '?_p=' + encodeURIComponent(restPath + location.search + location.hash)
      location.replace(redirectUrl)
    })()
  </script>
</head>
<body>
  正在跳转...
</body>
</html>

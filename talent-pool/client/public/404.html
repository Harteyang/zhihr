<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人才库管理</title>
  <script type="text/javascript">
    // GitHub Pages SPA fallback：将未知路径重定向到入口 index.html
    // 同时通过 _p 参数保留完整原始路径，由入口脚本恢复
    (function () {
      var originalPath = location.pathname + location.search + location.hash
      var redirectUrl = '/talent-pool/?_p=' + encodeURIComponent(originalPath)
      location.replace(redirectUrl)
    })()
  </script>
</head>
<body>
  正在跳转...
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>复盘系统 - 知HR工具集</title>
    <link href="https://fonts.loli.net/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      window.__API_BASE_URL__ = window.__API_BASE_URL__ || null;
      if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        var noop = function() {};
        console.log = noop;
        console.info = noop;
        console.warn = noop;
        console.debug = noop;
      }
    </script>
    <!-- 统一认证模块 -->
    <script src="/shared-auth.js"></script>
    <script src="/shared-auth-modal.js"></script>
    <script type="module" crossorigin src="assets/index-BmCB11Ko.js"></script>
    <link rel="stylesheet" crossorigin href="assets/index-QXsWTBbi.css">
  </head>
  <body>
    <div id="root"></div>

    <script>
      // 复盘系统 - 数据合并与登录检查逻辑
      (function() {
        'use strict';

        // ==================== 存储键名（与 SharedAuth 统一） ====================
        var TOKEN_KEY = 'zhihr_access_token';
        var REFRESH_TOKEN_KEY = 'zhihr_refresh_token';
        var USER_ID_KEY = 'zhihr_user_id';
        var USERNAME_KEY = 'zhihr_username';

        function getToken() { return localStorage.getItem(TOKEN_KEY); }
        function getRefreshToken() { return localStorage.getItem(REFRESH_TOKEN_KEY); }
        function getUserId() { return localStorage.getItem(USER_ID_KEY); }
        function getUsername() { return localStorage.getItem(USERNAME_KEY); }

        // ==================== 待提交队列 ====================
        var pendingFormDataQueue = [];

        // 登录成功事件处理
        window.addEventListener('zhihr-login-success', function(e) {
          var Kc = window.__KcStore__;
          if (Kc && typeof Kc.getState === 'function') {
            Kc.getState().loadFromCloud().then(function() {
              while (pendingFormDataQueue.length > 0) {
                var data = pendingFormDataQueue.shift();
                var opts = data.mode ? { mode: data.mode } : undefined;
                Kc.getState().saveRecord(data.date, data.content, data.summary, opts);
              }
            }).catch(function(err) {
              console.warn('云端同步失败:', err);
              while (pendingFormDataQueue.length > 0) {
                var data = pendingFormDataQueue.shift();
                var opts = data.mode ? { mode: data.mode } : undefined;
                Kc.getState().saveRecord(data.date, data.content, data.summary, opts);
              }
            });
          }
        });

        // 退出登录事件处理
        window.addEventListener('zhihr-logout', function() {
          pendingFormDataQueue = [];
        });

        // ==================== localStorage 管理 ====================
        var REVIEW_DATA_KEY = 'reviewData';
        var CACHE_VERSION_KEY = 'reviewCacheVersion';
        var CACHE_VERSION = 1;
        var MAX_STORAGE_SIZE = 4 * 1024 * 1024;
        var MAX_RECORDS = 500;

        function checkStorageQuota(neededBytes) {
          try {
            var used = 0;
            for (var i = 0; i < localStorage.length; i++) {
              var key = localStorage.key(i);
              used += (localStorage.getItem(key) || '').length * 2;
            }
            return (used + neededBytes) < MAX_STORAGE_SIZE;
          } catch (e) { return false; }
        }

        function validateReviews(data) {
          if (!Array.isArray(data)) return [];
          return data.filter(function(item) {
            return item && typeof item === 'object' && typeof item.date === 'string' && item.date.length > 0;
          }).slice(0, MAX_RECORDS);
        }

        function saveToLocalStorage(data) {
          try {
            var validated = validateReviews(data);
            var jsonStr = JSON.stringify(validated);
            if (!checkStorageQuota(jsonStr.length * 2)) {
              var thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
              var recent = validated.filter(function(item) { return item.date >= thirtyDaysAgo; });
              jsonStr = JSON.stringify(recent);
              if (!checkStorageQuota(jsonStr.length * 2)) {
                console.error('localStorage 空间不足，无法保存');
                return;
              }
            }
            localStorage.setItem(REVIEW_DATA_KEY, jsonStr);
            localStorage.setItem(CACHE_VERSION_KEY, String(CACHE_VERSION));
          } catch (e) {
            if (e.name === 'QuotaExceededError' || e.code === 22) {
              console.error('localStorage 配额已满，尝试清理旧数据');
              try {
                var sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
                var emergency = (Array.isArray(data) ? data : []).filter(function(item) {
                  return item && item.date >= sevenDaysAgo;
                });
                localStorage.setItem(REVIEW_DATA_KEY, JSON.stringify(emergency));
              } catch (e2) {
                console.error('紧急清理后仍无法保存:', e2);
              }
            } else {
              console.error('保存到 localStorage 失败:', e);
            }
          }
        }

        function loadFromLocalStorage() {
          try {
            var data = localStorage.getItem(REVIEW_DATA_KEY);
            if (!data) return null;
            var parsed = JSON.parse(data);
            var version = parseInt(localStorage.getItem(CACHE_VERSION_KEY) || '0', 10);
            if (version < CACHE_VERSION && version > 0) {
              console.warn('缓存版本过旧，将重新加载');
            }
            return validateReviews(parsed);
          } catch (e) {
            console.error('读取 localStorage 数据损坏，清除缓存:', e);
            try { localStorage.removeItem(REVIEW_DATA_KEY); } catch (e2) {}
            return null;
          }
        }

        // ==================== Kc Store 注入 ====================
        function patchKcStore() {
          var kcStore = null;

          if (window.__KcStore__) {
            kcStore = window.__KcStore__;
          }

          if (!kcStore) {
            for (var key in window) {
              try {
                var obj = window[key];
                if (obj && typeof obj === 'function' && obj.getState && obj.subscribe) {
                  var state = obj.getState();
                  if (state && Array.isArray(state.reviews) && state.saveRecord) {
                    kcStore = obj;
                    break;
                  }
                }
              } catch (e) {}
            }
          }

          if (kcStore) {
            console.log('找到 Kc Store');
            window.__KcStore__ = kcStore;

            var originalSaveRecord = kcStore.getState().saveRecord;
            kcStore.getState().saveRecord = async function(date, content, summary, options) {
              var mode = (options && options.mode) ? options.mode : 'auto';
              var token = getToken();
              var reviews = kcStore.getState().reviews || [];
              var existingRecords = reviews.filter(function(r) { return r.date === date; });
              var now = new Date().toISOString();
              var updatedReviews;
              var targetId;

              console.log('[saveRecord] mode:', mode, 'date:', date, 'existingCount:', existingRecords.length, 'loggedIn:', !!token);

              if (existingRecords.length > 0 && mode !== 'new') {
                var existing = existingRecords[0];
                var idx = reviews.findIndex(function(r) { return r.id === existing.id; });
                targetId = existing.id;
                updatedReviews = reviews.slice();
                updatedReviews[idx] = Object.assign({}, updatedReviews[idx], {
                  content: content, summary: summary, updatedAt: now, _source: 'local'
                });
              } else {
                targetId = 'local-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                var newRecord = {
                  id: targetId, date: date, content: content, summary: summary,
                  createdAt: now, updatedAt: now, _source: 'local'
                };
                updatedReviews = [newRecord].concat(reviews);
              }

              kcStore.setState({ reviews: updatedReviews });
              saveToLocalStorage(updatedReviews);

              // 未登录：提示登录
              if (!token) {
                pendingFormDataQueue.push({ date: date, content: content, summary: summary, mode: mode });
                if (typeof AuthModal !== 'undefined') {
                  AuthModal.open('login');
                }
                return;
              }

              // 已登录：提交到云端
              try {
                var apiResult;
                if (existingRecords.length > 0 && mode !== 'new') {
                  if (targetId.startsWith('local-')) {
                    apiResult = await SharedAuth.apiRequest('/api/reviews', {
                      method: 'POST',
                      body: JSON.stringify({ id: targetId, date: date, content: content, summary: summary })
                    });
                  } else {
                    apiResult = await SharedAuth.apiRequest('/api/reviews/' + targetId, {
                      method: 'PUT',
                      body: JSON.stringify({ date: date, content: content, summary: summary })
                    });
                  }
                } else {
                  apiResult = await SharedAuth.apiRequest('/api/reviews', {
                    method: 'POST',
                    body: JSON.stringify({ id: targetId, date: date, content: content, summary: summary })
                  });
                }

                var currentReviews = kcStore.getState().reviews || [];
                var idx = currentReviews.findIndex(function(r) { return r.id === targetId; });
                if (idx >= 0) {
                  var updated = currentReviews.slice();
                  var patch = { _source: 'cloud' };
                  if (apiResult && apiResult.data && apiResult.data.id && apiResult.data.id !== targetId) {
                    patch.id = apiResult.data.id;
                    updated = updated.filter(function(r, i) { return i !== idx && r.id !== apiResult.data.id; });
                    idx = updated.findIndex(function(r) { return r.id === targetId; });
                    if (idx < 0) {
                      updated.push(Object.assign({}, currentReviews.find(function(r) { return r.id === targetId; }), patch));
                    } else {
                      updated[idx] = Object.assign({}, updated[idx], patch);
                    }
                  } else {
                    updated[idx] = Object.assign({}, updated[idx], patch);
                  }
                  kcStore.setState({ reviews: updated });
                  saveToLocalStorage(updated);
                }
              } catch (err) {
                console.warn('[saveRecord] 云端提交失败，数据已本地缓存:', err);
              }
            };

            kcStore.getState().loadFromCloud = async function() {
              try {
                var token = getToken();
                if (!token) {
                  kcStore.setState({ isLoading: false });
                  return;
                }

                var allCloudData = [];
                var page = 1;
                var hasMore = true;
                while (hasMore) {
                  var result = await SharedAuth.apiRequest('/api/reviews?pageSize=100&page=' + page);
                  if (result && result.success && result.data) {
                    allCloudData = allCloudData.concat(result.data);
                    var pagination = result.pagination;
                    if (pagination && page < pagination.totalPages) {
                      page++;
                    } else {
                      hasMore = false;
                    }
                  } else {
                    hasMore = false;
                  }
                }

                if (allCloudData.length > 0) {
                  var cloudData = allCloudData.map(function(item) {
                    return Object.assign({}, item, { _source: 'cloud' });
                  });
                  var localData = kcStore.getState().reviews || [];

                  var mergedMap = new Map();
                  localData.forEach(function(item) {
                    if (item.id) mergedMap.set(item.id, item);
                  });

                  cloudData.forEach(function(item) {
                    if (item.id) {
                      var existing = mergedMap.get(item.id);
                      if (existing && existing._source === 'local' &&
                          existing.updatedAt && item.updatedAt &&
                          new Date(existing.updatedAt) >= new Date(item.updatedAt)) {
                        return;
                      }
                      mergedMap.set(item.id, item);
                    }
                  });

                  var merged = Array.from(mergedMap.values()).sort(function(a, b) {
                    if (a.date !== b.date) return b.date.localeCompare(a.date);
                    return new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0);
                  });

                  kcStore.setState({ reviews: merged, isLoading: false });
                  saveToLocalStorage(merged);
                  console.log('数据已合并:', merged.length, '条记录');
                }
              } catch (error) {
                console.warn('云端数据拉取失败，使用本地缓存:', error);
                kcStore.setState({ isLoading: false });
              }
            };

            console.log('Kc Store 已注入登录检查和数据合并逻辑');

            if (getToken()) {
              console.log('已登录，从云端同步数据...');
              if (SharedAuth && SharedAuth.getUser()) {
                kcStore.getState().loadFromCloud();
              }
            }
          } else {
            console.log('Kc Store 未找到，100ms 后重试');
            setTimeout(patchKcStore, 100);
          }
        }

        // ==================== 初始化 ====================
        function init() {
          // 初始化 SharedAuth
          if (typeof SharedAuth !== 'undefined') {
            SharedAuth.init();
          }

          // 初始化 AuthModal
          if (typeof AuthModal !== 'undefined') {
            AuthModal.init();
          }

          // 注入 Kc Store
          if (typeof DOMContentLoaded !== 'undefined') {
            patchKcStore();
          } else {
            document.addEventListener('DOMContentLoaded', patchKcStore);
          }
        }

        window.addEventListener('load', init);
      })();
    </script>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;padding:16px;background:#fee2e2;color:#991b1b;font-family:sans-serif;z-index:99999;border-bottom:2px solid #f87171;';
        overlay.innerHTML = '<strong>应用出现错误</strong><p style="margin:4px 0 0;font-size:14px;">页面遇到了问题，请刷新重试。如问题持续，请联系管理员。</p><button onclick="this.parentElement.remove()" style="margin-top:8px;padding:4px 12px;cursor:pointer;">关闭</button>';
        document.body.appendChild(overlay);
      };
    </script>
  </body>
</html>

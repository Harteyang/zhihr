    <style>

        display: none;

        top: 0;

        bottom: 0;
        background: rgba(0,0,0,0.5);

        justify-content: center;
        align-items: center;
        padding: 1rem;
      }
      
      .modal-overlay.active {
        display: flex;
      }
    </style>
    <script>
      window.__API_BASE_URL__ = window.__API_BASE_URL__ || null;
      if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        var noop = function() {};
        console.log = noop;
        console.info = noop;
        console.warn = noop;
        console.debug = noop;
      }
    </script>
    <!-- 统一认证模块 -->
    <script src="/shared-auth.js"></script>
    <script src="/shared-auth-modal.js"></script>
    <script type="module" crossorigin src="assets/index-BmCB11Ko.js"></script>
    <link rel="stylesheet" crossorigin href="assets/index-QXsWTBbi.css">
  </head>
  <body>
    <div id="root"></div>

    <script>
      // 复盘系统 - 本地数据存储逻辑
      (function() {
        'use strict';

        // ==================== localStorage 管理 ====================
        var REVIEW_DATA_KEY = 'reviewData';
        var CACHE_VERSION_KEY = 'reviewCacheVersion';
        var CACHE_VERSION = 1;
        var MAX_STORAGE_SIZE = 4 * 1024 * 1024;
        var MAX_RECORDS = 500;

        function checkStorageQuota(neededBytes) {
          try {
            var used = 0;
            for (var i = 0; i < localStorage.length; i++) {
              var key = localStorage.key(i);
              used += (localStorage.getItem(key) || '').length * 2;
            }
            return (used + neededBytes) < MAX_STORAGE_SIZE;
          } catch (e) { return false; }
        }

        function validateReviews(data) {
          if (!Array.isArray(data)) return [];
          return data.filter(function(item) {
            return item && typeof item === 'object' && typeof item.date === 'string' && item.date.length > 0;
          }).slice(0, MAX_RECORDS);
        }

        function saveToLocalStorage(data) {
          try {
            var validated = validateReviews(data);
            var jsonStr = JSON.stringify(validated);
            if (!checkStorageQuota(jsonStr.length * 2)) {
              var thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
              var recent = validated.filter(function(item) { return item.date >= thirtyDaysAgo; });
              jsonStr = JSON.stringify(recent);
              if (!checkStorageQuota(jsonStr.length * 2)) {
                console.error('localStorage 空间不足，无法保存');
                return;
              }
            }
            localStorage.setItem(REVIEW_DATA_KEY, jsonStr);
            localStorage.setItem(CACHE_VERSION_KEY, String(CACHE_VERSION));
          } catch (e) {
            if (e.name === 'QuotaExceededError' || e.code === 22) {
              console.error('localStorage 配额已满，尝试清理旧数据');
              try {
                var sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
                var emergency = (Array.isArray(data) ? data : []).filter(function(item) {
                  return item && item.date >= sevenDaysAgo;
                });
                localStorage.setItem(REVIEW_DATA_KEY, JSON.stringify(emergency));
              } catch (e2) {
                console.error('紧急清理后仍无法保存:', e2);
              }
            } else {
              console.error('保存到 localStorage 失败:', e);
            }
          }
        }

        function loadFromLocalStorage() {
          try {
            var data = localStorage.getItem(REVIEW_DATA_KEY);
            if (!data) return null;
            var parsed = JSON.parse(data);
            var version = parseInt(localStorage.getItem(CACHE_VERSION_KEY) || '0', 10);
            if (version < CACHE_VERSION && version > 0) {
              console.warn('缓存版本过旧，将重新加载');
            }
            return validateReviews(parsed);
          } catch (e) {
            console.error('读取 localStorage 数据损坏，清除缓存:', e);
            try { localStorage.removeItem(REVIEW_DATA_KEY); } catch (e2) {}
            return null;
          }
        }

        // ==================== Kc Store 注入 ====================
        function patchKcStore() {
          var kcStore = null;

          if (window.__KcStore__) {
            kcStore = window.__KcStore__;
          }

          if (!kcStore) {
            for (var key in window) {
              try {
                var obj = window[key];
                if (obj && typeof obj === 'function' && obj.getState && obj.subscribe) {
                  var state = obj.getState();
                  if (state && Array.isArray(state.reviews) && state.saveRecord) {
                    kcStore = obj;
                    break;
                  }
                }
              } catch (e) {}
            }
          }

          if (kcStore) {
            console.log('找到 Kc Store');
            window.__KcStore__ = kcStore;

            var originalSaveRecord = kcStore.getState().saveRecord;
            kcStore.getState().saveRecord = async function(date, content, summary, options) {
              var mode = (options && options.mode) ? options.mode : 'auto';
              var reviews = kcStore.getState().reviews || [];
              var existingRecords = reviews.filter(function(r) { return r.date === date; });
              var now = new Date().toISOString();
              var updatedReviews;
              var targetId;

              console.log('[saveRecord] mode:', mode, 'date:', date, 'existingCount:', existingRecords.length);

              if (existingRecords.length > 0 && mode !== 'new') {
                var existing = existingRecords[0];
                var idx = reviews.findIndex(function(r) { return r.id === existing.id; });
                targetId = existing.id;
                updatedReviews = reviews.slice();
                updatedReviews[idx] = Object.assign({}, updatedReviews[idx], {
                  content: content, summary: summary, updatedAt: now, _source: 'local'
                });
              } else {
                targetId = 'local-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                var newRecord = {
                  id: targetId, date: date, content: content, summary: summary,
                  createdAt: now, updatedAt: now, _source: 'local'
                };
                updatedReviews = [newRecord].concat(reviews);
              }

              kcStore.setState({ reviews: updatedReviews });
              saveToLocalStorage(updatedReviews);
            };

            // 空的 loadFromCloud 方法，保持接口兼容
            kcStore.getState().loadFromCloud = async function() {
              console.log('云端同步功能已禁用');
              kcStore.setState({ isLoading: false });
            };

            console.log('Kc Store 已注入本地存储逻辑');
          } else {
            console.log('Kc Store 未找到，100ms 后重试');
            setTimeout(patchKcStore, 100);
          }
        }

        // ==================== 初始化 ====================
        function init() {
          // 初始化 SharedAuth
          if (typeof SharedAuth !== 'undefined') {
            SharedAuth.init();
            
            // 监听登录事件，同步到复盘系统的 Zustand store
            SharedAuth.on('auth:login', function(data) {
              if (window.__ZHIHR_AUTH__ && window.__ZHIHR_AUTH__.store) {
                var store = window.__ZHIHR_AUTH__.store;
                var token = SharedAuth.getToken();
                store.getState().setAuth(data.userId, data.username, token);
              }
            });
            
            // 监听登出事件
            SharedAuth.on('auth:logout', function() {
              if (window.__ZHIHR_AUTH__ && window.__ZHIHR_AUTH__.store) {
                window.__ZHIHR_AUTH__.store.getState().clearAuth();
              }
            });
          }

          // 初始化 AuthModal
          if (typeof AuthModal !== 'undefined') {
            AuthModal.init();
          }

          if (typeof DOMContentLoaded !== 'undefined') {
            patchKcStore();
          } else {
            document.addEventListener('DOMContentLoaded', patchKcStore);
          }
        }

        window.addEventListener('load', init);
      })();
    </script>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;padding:16px;background:#fee2e2;color:#991b1b;font-family:sans-serif;z-index:99999;border-bottom:2px solid #f87171;';
        overlay.innerHTML = '<strong>应用出现错误</strong><p style="margin:4px 0 0;font-size:14px;">页面遇到了问题，请刷新重试。如问题持续，请联系管理员。</p><button onclick="this.parentElement.remove()" style="margin-top:8px;padding:4px 12px;cursor:pointer;">关闭</button>';
        document.body.appendChild(overlay);
      };
    </script>
  </body>
</html>
